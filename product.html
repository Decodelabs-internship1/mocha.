<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section class="products">
        <h2>Our Products</h2>

        <div class="product-container">
            <div class="product-card">
                <img src="images/coffee1.jpg" alt="">
                <h3>Mocha Coffee</h3>
                <p>$15</p>
                <button class="buy-btn" type="button" data-name="Mocha Coffee" data-price="15">Add To Cart</button>
            </div>

            <div class="product-card">
                <img src="images/coffee2.jpg" alt="">
                <h3>Cappuccino</h3>
                <p>$20</p>
                <button class="buy-btn" type="button" data-name="Cappuccino" data-price="20">Add To Cart</button>
            </div>

            <div class="product-card">
                <img src="images/coffee3.jpg" alt="">
                <h3>Latte</h3>
                <p>$18</p>
                <button class="buy-btn" type="button" data-name="Latte" data-price="18">Add To Cart</button>
            </div>
        </div>
    </section>
</body>
</html>
